name: Windows process tree

on:
  pull_request:
    paths:
      - ".github/workflows/windows-process-tree.yml"
      - "packages/adapter-utils/src/**"
      - "packages/adapters/codex-local/src/server/**"
      - "server/src/services/heartbeat.ts"
      - "server/src/services/local-service-supervisor.ts"
      - "server/src/__tests__/heartbeat-windows-ownership-repair.test.ts"
      - "server/src/__tests__/local-service-supervisor-windows.test.ts"
      - "server/src/__tests__/codex-local-skill-injection.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process_tree:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exercise real Windows descendants and reject skipped tests
        shell: pwsh
        env:
          PAPERCLIP_EMBEDDED_POSTGRES_STARTUP_TIMEOUT_MS: "60000"
        run: |
          pnpm exec vitest run packages/adapter-utils/src/windows-process-tree.test.ts packages/adapter-utils/src/windows-orphan-sweep.test.ts server/src/__tests__/local-service-supervisor-windows.test.ts packages/adapters/codex-local/src/server/output-inactivity-monitor.integration.test.ts server/src/__tests__/codex-local-skill-injection.test.ts --reporter=default --reporter=junit --outputFile.junit=windows-process-tree.junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # PostgreSQL startup competes with the real process-tree cases for
          # Windows process discovery. Keep the durable replay regression real,
          # but run it sequentially so either suite fails on its own behavior.
          pnpm exec vitest run server/src/__tests__/heartbeat-windows-ownership-repair.test.ts --reporter=default --reporter=junit --outputFile.junit=windows-ownership-repair.junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$processReport = Get-Content -LiteralPath windows-process-tree.junit.xml -Raw
          [xml]$ownershipReport = Get-Content -LiteralPath windows-ownership-repair.junit.xml -Raw
          # These cases are `runIf(win32)`: on any other runner they would report
          # green by skipping. The floor is what stops the suite from silently
          # shrinking back to a gate that proves nothing. Raise it when adding
          # cases; never lower it to make a red build pass.
          $expected = 19
          $executed = $processReport.SelectNodes('//testcase').Count + $ownershipReport.SelectNodes('//testcase').Count
          $inconclusive = $processReport.SelectNodes('//skipped | //failure | //error').Count + $ownershipReport.SelectNodes('//skipped | //failure | //error').Count
          if ($executed -lt $expected -or $inconclusive -gt 0) {
            throw "Windows process-tree suite must execute every required case without skips or failures (executed=$executed expected>=$expected inconclusive=$inconclusive)"
          }
