name: PostgreSQL persistence

on:
  push:
    branches:
      - codex/lac-paperclip-unicode-terminalization
    paths:
      - ".github/workflows/postgres-persistence.yml"
      - "server/src/__tests__/heartbeat-nul-persistence.integration.test.ts"
      - "server/src/services/heartbeat-persistence-safety.test.ts"
      - "server/src/services/heartbeat-persistence-safety-postgres.test.ts"
      - "server/src/services/heartbeat-persistence-safety.ts"
      - "server/src/services/heartbeat.ts"
      - "packages/db/src/test-embedded-postgres.ts"
      - "packages/db/src/embedded-postgres-native.ts"
      - "packages/db/src/migrations/**"
      - "packages/db/src/schema/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat_nul_persistence:
    name: Heartbeat NUL persistence (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The test helper creates and drops an isolated database per suite from
      # this service. Its validation only accepts an unmistakably test-only DB.
      PAPERCLIP_TEST_DATABASE_URL: postgres://paperclip:paperclip@127.0.0.1:5432/paperclip_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paperclip_test
          POSTGRES_USER: paperclip
          POSTGRES_PASSWORD: paperclip
        options: >-
          --health-cmd "pg_isready -U paperclip -d paperclip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # JUnit preserves the exact number of test cases. A skipped suite would
      # otherwise let Vitest exit successfully, so reject skips and zero-test
      # reports after every required suite (fail closed).
      - name: Run PostgreSQL persistence suites (fail closed on skips)
        shell: bash
        run: |
          set -euo pipefail

          run_suite() {
            local project="$1"
            local test_file="$2"
            local report_file="$(basename "$test_file").junit.xml"

            pnpm exec vitest run --project "$project" "$test_file" \
              --pool=forks --isolate --reporter=verbose --reporter=junit \
              --outputFile.junit="$report_file"

            if grep -q '<skipped' "$report_file"; then
              echo "::error::${test_file} contained skipped tests; PostgreSQL CI must not pass on a skip."
              exit 1
            fi
            if ! grep -qE 'tests="[1-9][0-9]*"' "$report_file"; then
              echo "::error::${test_file} reported zero executed tests."
              exit 1
            fi

            echo "JUnit test count for ${test_file}:"
            grep -Eo '<testsuites[^>]*tests="[0-9]+"' "$report_file" || true
          }

          run_suite server server/src/__tests__/heartbeat-nul-persistence.integration.test.ts
          run_suite server server/src/services/heartbeat-persistence-safety.test.ts
          run_suite server server/src/services/heartbeat-persistence-safety-postgres.test.ts
          run_suite packages/db packages/db/src/test-embedded-postgres.test.ts
