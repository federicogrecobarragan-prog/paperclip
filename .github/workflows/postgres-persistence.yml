name: PostgreSQL persistence

on:
  push:
    branches:
      - codex/lac-paperclip-unicode-terminalization
    paths:
      - ".github/workflows/postgres-persistence.yml"
      - "server/src/__tests__/heartbeat-nul-persistence.integration.test.ts"
      - "server/src/services/heartbeat-persistence-safety.ts"
      - "server/src/services/heartbeat.ts"
      - "packages/db/src/test-embedded-postgres.ts"
      - "packages/db/src/embedded-postgres-native.ts"
      - "packages/db/src/migrations/**"
      - "packages/db/src/schema/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat_nul_persistence:
    name: Heartbeat NUL persistence (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPERCLIP_EMBEDDED_POSTGRES_STARTUP_TIMEOUT_MS: "10000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite conditionally skips on hosts where embedded PostgreSQL cannot
      # start. CI must treat that as a failed gate, never as a passing no-op.
      - name: Require embedded PostgreSQL support
        run: >-
          pnpm exec tsx --eval
          "import { getEmbeddedPostgresTestSupport } from '@paperclipai/db'; void (async () => { const support = await getEmbeddedPostgresTestSupport(); if (!support.supported) { throw new Error('Embedded PostgreSQL is unavailable: ' + (support.reason ?? 'unknown reason')); } })();"

      - name: Run heartbeat NUL persistence suite
        run: >-
          pnpm exec vitest --project @paperclipai/server
          server/src/__tests__/heartbeat-nul-persistence.integration.test.ts
          --pool=forks --isolate
